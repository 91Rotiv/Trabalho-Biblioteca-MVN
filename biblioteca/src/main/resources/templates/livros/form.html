
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro</title>

</head>

<body>

    <h1>Cadastrar Livro</h1>

    <form th:action="@{/livros}" th:object="${livro}" method="post">

        <label for="titulo">Título:</label>
        <input type="text" th:field="*{titulo}" required>

        <label for="autor">Autor:</label>
        <input type="text" th:field="*{autor}" required>

        <label for="isbn">ISBN:</label>
        <input type="text" th:field="*{isbn}" required>

        <button type="submit">Cadastrar</button>

    </form>

    <p>
        <a th:href="@{/livros}">Voltar para início</a>
    </p>

</body>
</html>
