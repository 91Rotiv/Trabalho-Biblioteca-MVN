<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Autor</title>
</head>
<body>
    <h1>Cadastrar Autor</h1>

    <form th:action="@{/autores}" th:object="${autor}" method="post">
        <label for="nome">Nome:</label>
        <input type="text" th:field="*{nome}" required>

        <label for="nacionalidade">Nacionalidade:</label>
        <input type="text" th:field="*{nacionalidade}" required>

        <label for="obraPublicada">Obra publicada:</label>
        <input type="text" th:field="*{obraPublicada}" required>

        <button type="submit">Cadastrar</button>
    </form>

    <p><a th:href="@{/livros}">Voltar ao início</a></p>
</body>
</html>
