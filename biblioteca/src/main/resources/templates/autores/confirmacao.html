<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autor cadastrado</title>
</head>
<body>
    <h1>Autor cadastrado!</h1>

    <p>Nome: <span th:text="${autor.nome}"></span></p>
    <p>Nacionalidade: <span th:text="${autor.nacionalidade}"></span></p>
    <p>Obra publicada: <span th:text="${autor.obraPublicada}"></span></p>

    <p><a th:href="@{/autores}">Cadastrar outro autor</a></p>
    <p><a th:href="@{/livros}">Voltar ao início</a></p>
</body>
</html>
